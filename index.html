<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <header>
      <section class="container">
        <nav>
          <h2>Where in the world?</h2>
          <div id="dark-btn">
            <img src="./Group 3.svg" alt="moon" />
            <p>Dark Mode</p>
          </div>
          <a id="ligth-btn"
            ><img src="./Group 3.svg" alt="moon" /> Ligth Mode</a
          >
        </nav>
      </section>
    </header>
    <main class="container">
      <div>
        <img src="./icon-search-white.svg" alt="icon-search-white" />
        <input type="text" placeholder="Search for a country…" id="input" />
      </div>
      <select id="select">
        <option value="Africa">Africa</option>
        <option value="America">America</option>
        <option value="Asia">Asia</option>
        <option value="Europe">Europe</option>
        <option value="Oceania">Oceania</option>
        <option value="All">All</option>
      </select>
    </main>
    <footer>
      <div class="container countries"></div>
    </footer>
  </body>
  <script type="module" src="app.js"></script>
</html>
